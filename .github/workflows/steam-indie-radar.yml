name: Update Steam Indie & Trending Games Radar

on:
  schedule:
    # 매일 한국시간 오전 9시 (UTC 00:00) 자동 수집
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-steam-trends:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Steam KR Indie & Popular Trends
        shell: python
        run: |
          import json
          import re
          import urllib.request
          import html
          from datetime import datetime, timezone, timedelta

          def fetch_json(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=15) as resp:
                  return json.loads(resp.read().decode('utf-8'))

          app_ids = []

          # 1. Steam KR Indie Tag (492) Top Trending & Sellers
          try:
              indie_url = "https://store.steampowered.com/search/results/?query&start=0&count=16&tags=492&infinite=1&cc=kr&l=koreana"
              indie_res = fetch_json(indie_url)
              matches = re.findall(r'data-ds-appid="(\d+)"', indie_res.get('results_html', ''))
              for m in matches:
                  aid = int(m)
                  if aid not in app_ids and len(app_ids) < 12:
                      app_ids.append(aid)
          except Exception as e:
              print("Indie search error:", e)

          # 2. Steam KR Featured New Releases & Top Sellers
          try:
              feat_url = "https://store.steampowered.com/api/featuredcategories?l=koreana&cc=kr"
              feat_res = fetch_json(feat_url)
              for key in ('new_releases', 'top_sellers'):
                  items = (feat_res.get(key) or {}).get('items') or []
                  for item in items:
                      aid = item.get('id')
                      if aid and int(aid) not in app_ids and len(app_ids) < 22:
                          app_ids.append(int(aid))
          except Exception as e:
              print("Featured error:", e)

          games = []
          for aid in app_ids:
              try:
                  detail_url = f"https://store.steampowered.com/api/appdetails?appids={aid}&l=koreana&cc=kr"
                  detail_res = fetch_json(detail_url)
                  entry = detail_res.get(str(aid), {})
                  if not entry.get('success'):
                      continue
                  d = entry.get('data', {})
                  if d.get('type') != 'game':
                      continue
                  genres = [g.get('description', '') for g in d.get('genres', []) if g.get('description')]
                  is_indie = ('인디' in genres) or ('Indie' in genres)
                  devs = ", ".join(d.get('developers') or ['-'])
                  pubs = ", ".join(d.get('publishers') or ['-'])
                  platforms = ['PC (Steam)']
                  if (d.get('platforms') or {}).get('mac'):
                      platforms.append('macOS')
                  po = d.get('price_overview') or {}
                  price_str = '무료 플레이' if d.get('is_free') else (po.get('final_formatted') or '출시 예정 / 미정')
                  discount = po.get('discount_percent', 0)
                  recs = (d.get('recommendations') or {}).get('total', 0)

                  games.append({
                      'appid': aid,
                      'name': d.get('name', ''),
                      'is_indie': is_indie,
                      'header_image': f"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/{aid}/header.jpg",
                      'short_description': html.unescape(d.get('short_description', '')),
                      'genres': ", ".join(genres),
                      'developer': devs,
                      'publisher': pubs,
                      'platforms': ", ".join(platforms),
                      'release_date': (d.get('release_date') or {}).get('date', ''),
                      'price': price_str,
                      'discount_percent': discount,
                      'recommendations': recs,
                      'store_url': f"https://store.steampowered.com/app/{aid}/"
                  })
              except Exception as e:
                  print(f"App {aid} error:", e)

          if games:
              kst = timezone(timedelta(hours=9))
              payload = {
                  'updated_at': datetime.now(kst).strftime('%Y-%m-%d %H:%M'),
                  'items': games
              }
              with open('assets/data/steam-trends.json', 'w', encoding='utf-8') as f:
                  json.dump(payload, f, ensure_ascii=False, indent=2)
              print(f"Updated steam-trends.json with {len(games)} games.")

      - name: Commit and Push if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/steam-trends.json
          git diff --staged --quiet || (git commit -m "chore(data): auto-update Steam indie & trending games radar" && git push)

# ==============================================================================
# Byeon's Portfolio & Game Archive - Jekyll Configuration
# ==============================================================================

title: "Byeon's Portfolio & Game Archive"
tagline: "레벨 디자인 · 게임 시스템 분석 · 심층 리뷰 & 프로젝트 아카이브"
description: >-
  게임 레벨 디자이너 변성민의 개인 포트폴리오 및 게임 칼럼, 심층 리뷰 아카이브입니다.
  공간 설계, 플레이어 경험 유도, 게임 메커니즘 분석과 프로젝트 기록을 다룹니다.

baseurl: ""
url: "https://byeonsatto.github.io"
lang: "ko-KR"
timezone: "Asia/Seoul"

# Permalink Structure
permalink: /:categories/:title/

# Build Settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  toc_levels: 2..3

# Plugins supported natively by GitHub Pages
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Navigation Menu
navigation:
  - title: "Home"
    url: "/"
  - title: "Portfolio"
    url: "/portfolio/"
  - title: "Column"
    url: "/column/"
  - title: "Review"
    url: "/review/"

# Author & Social Profile
author:
  name: "변성민 (Byeon Seong-min)"
  role: "Game Level & System Designer"
  email: "qustjdals46@naver.com"
  avatar: "/assets/images/profile.jpg"
  bio: "플레이어의 시선과 동선을 설계하는 레벨 디자이너입니다. 게임의 공간 구조와 시스템 메커니즘을 해부하고 기록합니다."
  links:
    - label: "Naver Blog"
      url: "https://blog.naver.com/qustjdals46"
    - label: "YouTube"
      url: "https://www.youtube.com/@%EB%B3%80%EC%84%B1%EB%AF%BC"
    - label: "Notion"
      url: "https://app.notion.com/p/36ee398987dc801a8339fc3a361769c2?source=copy_link&assetsVersion=23.13.20260529.1029"
    - label: "GitHub"
      url: "https://github.com/byeonsatto"

# Include underscore-prefixed portfolio project pages if needed
include:
  - portfolio/_sample-project.md

# Default Front-matter Values
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "변성민"
  - scope:
      path: "portfolio"
    values:
      layout: "post"
      author: "변성민"

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
